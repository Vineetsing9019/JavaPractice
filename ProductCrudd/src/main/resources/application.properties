spring.application.name=ProductCrudd
spring.datasource.url=jdbc:mysql://localhost:3306/ProductCrudd
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
# defines ddl-auto mode, handling DDL commands
#DDL-auto -'update' for development - uses existing table, creates new table if it is not there
#DDL-auto - 'none' for producction - no structural changes  in table allowed
spring.jpa.hibernate.ddl-auto=update

#optional properties - only in development
spring.jpa.show-sql=true
spring.jpa.properties.format_sql=true
